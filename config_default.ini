; SN TalkBot - single-bot configuration
; Copy this file to config.ini and edit the values marked CHANGE_ME.

[features]
; Feature profiles for each bot instance.
; Full bot  = player_enabled=True,  server_management_enabled=True
; Player    = player_enabled=True,  server_management_enabled=False
; Manager   = player_enabled=False, server_management_enabled=True
player_enabled = True
server_management_enabled = True

[server]
address = CHANGE_ME
tcp_port = 10333
udp_port = 10333
encrypted = False
username = CHANGE_ME
password =

[bot]
language = th
nickname = SN TalkBot
client_name = SN TalkBot 2026
gender = 0
default_channel = /
channel_password =
; auto = show the active bot type. Use cs <text> for a custom status.
status_message = auto
; Randomized public message when a user logs in. True = on, False = off.
; Runtime command: /welcomebroadcast [on|off|status]
welcome_broadcast = True
random_message_interval = 0
vpn_detection = False
prevent_noname = False
noname_note = กรุณาตั้งชื่อผู้ใช้ก่อนเชื่อมต่อใหม่
; Accept commands and other bot features from TeamTalk channel text.
; Runtime: channelinput on|off|status (alias: ci). Private messages always remain available.
channel_input_enabled = True
intercept_channel_messages = True
jail_users =
jail_names =
jail_channel = /jail/
jail_timer_seconds = 10
jail_flood_count = 5
char_limit = 0
char_limit_mode = 1
blacklist_mode = 1
video_deletion_timer = 15
banned_countries =
profanity_filter_enabled = False
tts_enabled = True
; Separate from welcome_broadcast: static message when a user joins the bot's channel.
; Runtime command: /welcome (toggle on/off)
welcome_mode = 0
welcome_msg = ยินดีต้อนรับคุณ ชื่อ เข้าสู่ห้องครับ
is_locked = False
blocked_commands =
reconnection_attempts = -1
reconnection_timeout = 10

[playback]
; input_device may be auto, a TeamTalk sound-device ID, or part of a device name.
; On headless Linux/Docker, auto normally selects the PulseAudio monitor bridge.
input_device = auto
; output_device may be auto, an mpv device name, or an index shown by --devices
output_device = auto
seek_step = 5
default_volume = 80
max_volume = 150
send_channel_messages = True
channel_messages_mode = private
volume_fading = 0
cookiefile_path =
audio_quality = High
audio_buffer = 0.5
is_stereo_wide = False
is_stereo_echo = False
is_bass_boosted = False
speed = 1.0
fade_enabled = True
queue_mode = True
; M1 = single, M2 = auto/next, M3 = repeat current track
play_mode = 2
autoplay_enabled = True
announce_tracks = True
announce_queue = True
; Player announcement TTS is independent from Manager /say TTS.
announcement_provider = gtts
announcement_tts_mode = google
; Legacy key kept for backward compatibility.
announcement_voice = th-TH-PremwadeeNeural
announcement_microsoft_voice = th-TH-PremwadeeNeural
announcement_google_lang = th
announcement_google_tld = com
announcement_google_slow = False
announcement_rate = 0
announcement_google_speed = 1.0
announcement_volume = 1.0

[ytdlp]
; yt-dlp 2026.08.19+ uses an external JS solver for full YouTube support.
format = bestaudio/best
timeout = 20
retries = 5
fragment_retries = 5
concurrent_fragment_downloads = 4
; Leave blank unless you intentionally use curl-cffi impersonation.
impersonate =

[tts]
; Google mode uses standard gTTS (Google Translate TTS) and needs no API key.
provider = gtts
; microsoft = Edge TTS, google = Google standard gTTS
mode = google
google_lang = th
google_tld = com
google_slow = False
google_speed = 1.0
random_broadcast_enabled = False

[weather]
api_key =

[groq]
api_key =
model = llama-3.1-8b-instant
base_url = https://api.groq.com/openai/v1

[telegram]
; Prefer helper environment defaults on Docker so secrets stay out of Git/image history.
telegram_bot_token =

[exclusion]
ips =
usernames =
nicknames =

[accounts]
detection_mode = 1
custom_username =
authorized_users =
detect_server_admins = True

[account_requests]
enabled = False
smtp_host =
smtp_port = 587
smtp_username =
smtp_password =
smtp_use_tls = True
smtp_use_ssl = False
smtp_tls_verify = True
smtp_from =
smtp_from_name = SN TalkBot
smtp_subject = รหัสยืนยันบัญชี TeamTalk ของคุณ
smtp_timeout = 15
otp_expiry_seconds = 600
max_attempts = 3
user_data_file =
telegram_bot_token =
telegram_chat_id =

[ssh]
hostname =
port = 22
username =
password =
allowed_ips =

[teamtalk_license]
; Required for end-user use of the TeamTalk SDK beyond its trial terms.
license_name =
license_key =
[logging]
level = INFO
max_bytes = 5242880
backup_count = 3
console = True

